# @package _global_
#
# Shared Wan2.2-TI2V-5B DROID defaults.

defaults:
  - override /experiment: video_generation
  - override /dataset: droid
  - _self_

dataset:
  resolution: [832, 480]
  max_frames: 49
  n_frames: 49
  num_validation_clips: 4
  latent:
    type: online
  poses: false
  external_cond_dim: 0
  external_cond_processing: null

algorithm:
  training_context_frames: 0
  backbone:
    forward_window_size: ${...algorithm.n_frames}
  tasks:
    prediction:
      streaming:
        schedule: chunk
        mode: fixed
        sliding_context_frames: 13
        initial_context_frames: 13
        stride_in_frames: 36
        inner_steps_per_emit: null
        max_inner_steps: null
        conditioning_mode: conditional
        stabilization_level: 0.0
        stop_based_on: gradnorm
        emit_eps: 0.0
        frame_done_eps: 0.0
        emit_noise_level: 0.0
        frame_done_noise_level: 0.0
        max_cycles_without_emit: default
        initial_noise_profile: flat
  logging:
    fps: 15
    max_num_videos: 4
    metrics_batch_size: 1
    metrics_frame_batch_size: 4
    vbench_metrics_frame_batch_size: 4
    log_global_denoising_schedule: false
    log_frame_nfe: false
    log_global_readout_noise_level_schedule: false
    log_global_velocity_schedule: false
    velocity_log_yscale: true
    raw_velocity: true
    loss_bucket_count: 5

experiment:
  ema:
    enable: true
    decay: 0.9996
    validate_original_weights: false
  devices: "auto"
  training:
    batch_size: 1
    lr: 1e-4
    precision: bf16
    dataloader:
      num_workers: 8
      shuffle: true
    max_epochs: -1
    checkpointing:
      every_n_train_steps: 2000
      every_n_epochs: null
      save_on_train_epoch_end: false
      enable_version_counter: false
      monitor: validation/loss
      mode: min
      save_top_k: 1
      save_last: true
      filename: best_loss
      auto_insert_metric_name: false
    optim:
      optimizer_beta: [0.9, 0.99]
      gradient_clip_val: 1.0
    weight_decay: 1e-3
    lr_scheduler:
      name: constant_with_warmup
      num_warmup_steps: 2000
    compile: ${algorithm.compile}
    splits_included: ["training"]

  validation:
    batch_size: 1
    precision: 32
    val_every_n_step: 2000
    val_every_n_epoch: null
    limit_batch: 1.0
    dataloader:
      num_workers: 2
      shuffle: false
    num_sanity_val_steps: 1
    splits_included: ["validation"]
    sample_during_training: true

  find_unused_parameters: false
