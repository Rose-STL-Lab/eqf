# @package _global_

# python -m main shortcode=exp/minecraft/eqf/train_noiselevel ckpt_map=default +name=minecraft_nlp_eqf load=/path/to/minecraft_eqf.ckpt

defaults:
  # model config such as size and inference params
  - model_config/cogv/100m

  # Shared across models for a particular dataset
  - exp/minecraft/minecraft_base
  - override /algorithm: noiselevelpred_eqf_video

  - _self_

# ----------------------------
# Load / resume controls
# ----------------------------
# W&B run id to resume logging into (optional).
resume: null
# Full Lightning checkpoint load path (model + trainer state); optional.
load: null
# Optional manual requeue mode.
requeue: null

experiment:
  devices: 1
  training:
    batch_size: 8
  validation:
    batch_size: 8

algorithm:
  # Freeze all backbone params for readout-only training.
  backbone:
    trainable_params: []

  logging:
    log_global_readout_noise_level_schedule: false

  # Weights-only load path (alternative to top-level `load`).
  # Do not set this together with top-level `load`.
  load_model_state: null
  # Usually `state_dict` for Lightning .ckpt, or custom key for exported state files.
  model_state_key: "state_dict"
  load_model_state_mode: strict

  # Keep optimizer loading explicit for readout finetuning.
  # Leave null for fresh optimizer state unless you explicitly want to restore.
  load_opt_state: null
  # If `load_opt_state` is set to a file containing a nested optimizer dict, key goes here.
  opt_state_key: "optim_state"

  checkpoint:
    # Allow loading checkpoints that do not contain readout_head.* keys.
    strict: false
    # Start optimizer fresh when adding/changing readout params.
    reset_optimizer: true

  tasks:
    prediction:
      streaming:
        emit_eps: 0.0 # adaptive: block residual threshold
        frame_done_eps: 0.0 # adaptive: per-frame freeze threshold
        stop_based_on: gradnorm # gradnorm or readout
        emit_noise_level: 0.0 # adaptive readout: block noise level threshold
        frame_done_noise_level: 0.0 # adaptive readout: per-frame freeze threshold
        max_cycles_without_emit: default # max number of inner loops allowed between emitting a prefix

  denoising:
    equilibrium_schedule: constant
    truncated_a: 0.8
    equilibrium_lambda: 1.0
    sampling_algorithm: gd # gd, ngd
    num_sampling_steps: 100
    default_eta_multiple: 1.0
    mu: 0.0
